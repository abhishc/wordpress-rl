# Replaces the image's any-username + USER_PASSWORD passdb.
# Only local-parts listed in /srv/vmail/.users can IMAP/LMTP-login.
# Passwd file is users.runtime from app.yaml login. Not published.

import_environment {
  DOVEADM_PASSWORD = %{env:DOVEADM_PASSWORD | default}
  USER_PASSWORD = %{env:USER_PASSWORD | default('{CRYPT}*')}
}

passdb passwd-file {
  auth_username_format = %{user | username}
  passwd_file_path = /srv/vmail/.users
  default_password_scheme = PLAIN
}

userdb passwd-file {
  auth_username_format = %{user | username}
  passwd_file_path = /srv/vmail/.users
  fields {
    uid:default = 1000
    gid:default = 1000
    home:default = /srv/vmail/%{user | username}
  }
}
